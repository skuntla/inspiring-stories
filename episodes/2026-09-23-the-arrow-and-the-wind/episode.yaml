- id: title-card
  description: The episode title over soft hills.
- id: target-closeup
  description: Close on a straw archery target with red rings, untouched.
- id: arrow-lands-close
  description: Close on the target; an arrow curves with the wind and lands close to the center.
- id: notebook-page
