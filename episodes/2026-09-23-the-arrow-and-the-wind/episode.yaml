schema: story-episode/v1
id: 2026-09-23-the-arrow-and-the-wind
series: quiet-lessons
title: The Arrow and the Wind
logline: A young monk who believes and prays but sees nothing change learns from his teacher that intention needs action, and action needs to move with the wind.
moral: Aim with faith, act with courage, and adjust when the wind changes.
music: hopeful
language: en
content_rating: all-ages
source:
  kind: original
  notes: 'The producer''s story, directed for SVG: a hook and title card, the full confession and the mirror ending kept.'
cast:
- narrator
- kai
- master-ren
- master-kai
- novice
locations:
- id: arrow-blown-off
