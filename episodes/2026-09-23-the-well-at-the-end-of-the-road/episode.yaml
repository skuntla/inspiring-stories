schema: story-episode/v1
id: 2026-09-23-the-well-at-the-end-of-the-road
series: quiet-lessons
title: The Well at the End of the Road
logline: A poor man at the end of a dusty road digs for ten years to find water, then refuses to sell it unfairly, and the world comes to his door.
moral: Discipline digs the well; integrity keeps the water clean; do both and the world will find you.
music: hopeful
language: en
content_rating: all-ages
source:
  kind: original
  notes: 'Producer''s concept, improvised and directed for SVG: hook, Meena''s callback, two integrity tests.'
cast:
- narrator
- velu
- velu-old
- meena
- meena-grown
- merchant
- villager
- traveller
locations:
- id: shovel-strike
  description: Close on hard rock at the bottom of a pit, struck by an iron shovel; later it cracks and water bursts up.
- id: title-card
  description: The episode title over soft hills.
- id: dry-village
  description: 'A dry village where the road runs out: cracked fields, mud houses, a dead well, women walking with pots.'
- id: velu-plot
  description: 'Velu''s stony plot: a brick-lined pit, a green neem tree, his small hut and a clay lamp.'
- id: pit-bottom
  description: Inside the deep brick-lined pit, looking up at a circle of sky.
- id: the-well
  description: The finished stone well with a pulley and bucket, Velu's wooden counter, the neem tree and a queue of women.
- id: coins-in-palm
  description: Close on a work-worn palm holding two copper coins.
- id: market-road
  description: 'Years later: a busy market around the well with stalls, bunting and camel caravans.'
- id: closing-card
  description: The closing words over soft hills.
props:
- id: clay-pot
  description: A round terracotta water pot with a short neck and a white band.
- id: water-cup
  description: A brass tumbler brimming with water.
- id: money-bag
  description: A heavy maroon velvet pouch tied with gold cord, gold coins spilling out.
- id: brick-stack
  description: A stack of hand-baked red-brown bricks.
- id: dirt-mound
  description: A heap of dug earth and broken rock.
- id: spring-pool
  description: Clear spring water pooling and rippling at the bottom of the pit.
