publishing:
  title: The Well at the End of the Road | A Story About Discipline and Integrity
  description: Velu has nothing but a stony plot at the end of a dusty road and an old iron shovel. For ten years he digs while the village laughs. When he finally strikes water, a rich merchant offers
    him gold to lock it away. What Velu does next turns a forgotten village into the most trusted market in the land.
  tags:
  - inspiring story
  - discipline
  - integrity
  - motivational story
  - animated story
  - moral story
  - success story
  - The Well at the End of the Road
  made_for_kids: false
  thumbnail:
    hook: DIG YOUR WELL
    concept: Velu with his shovel in the pit, a spring of clear water bursting up at his feet.
    characters:
    - velu
