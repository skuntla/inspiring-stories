[project]
name = "story-pipeline"
version = "0.1.0"
description = "Local pipeline that turns a short story into a narrated, animated-feeling video."
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.18,<5",
    "Pillow>=10.1,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
story = "story.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.setuptools.package-data]
story = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
