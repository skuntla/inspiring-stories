[project]
name = "story-pipeline"
version = "0.1.0"
description = "Local pipeline that turns a short story into a narrated, animated-feeling video."
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
# Local Kokoro TTS for `story voice`. Pins match the versions proven in the voicemodels project.
voice = [
    "kokoro==0.9.4",
    "misaki==0.9.4",
    "torch==2.6.0",
    "numpy==1.26.4",
    "soundfile==0.14.0",
]

[project.scripts]
story = "story.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.setuptools.package-data]
story = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
